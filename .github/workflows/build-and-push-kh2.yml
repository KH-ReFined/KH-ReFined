# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "mother" ]
  pull_request:
    branches: [ "mother" ]
 
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ReFined.sln
  CONFIG_BUILD: Release
  PLATFORM_BUILD: x64

permissions:
  contents: write

jobs:
  build-kh2:
    runs-on: windows-latest

    steps:
    - name: Fetch Repo - KH-ReFined
      uses: actions/checkout@v4
      with:
        path: 'src'
        ref: 'mother'
        repository: 'KH-ReFined/KH-ReFined'
        persist-credentials: false
        
    - uses: microsoft/setup-msbuild@v1.0.2
    
    - name: Build - ReFined.KH2.dll
      working-directory: "src/"
      run: msbuild /m /p:Configuration=${{env.CONFIG_BUILD}} /p:Platform=${{env.PLATFORM_BUILD}} ${{env.SOLUTION_FILE_PATH}}

    - name: Fetch Repo - KH2-MAIN
      uses: actions/checkout@v4
      with:
        path: 'dest'
        ref: 'main'
        repository: 'KH-ReFined/KH2-MAIN'
        token: ${{ secrets.KH2_PUSHKEY }}
        fetch-depth: 0
        persist-credentials: false
        
    - name: Synchronize Output to KH2-MAIN
      run: | 
        Copy-Item -Path "src/x64/Release/ReFined.KH2.dll" -Destination "dest/engine/"
        Copy-Item -Path "src/x64/Release/ModuleRF-*.dll" -Destination "dest/engine/modules"

    - name: Push to KH2-MAIN
      run: |
        cd dest
        
        git config user.name "TopazTK [BOT]"
        git config user.email "topaztk-bot@users.noreply.github.com"
        
        git add .
        git commit -m "Synchronize from KH-ReFined [BOT]"
        git push origin main
